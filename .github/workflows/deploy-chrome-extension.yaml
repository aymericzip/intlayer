name: 🧩 Publish Browser Extensions (Chrome & Firefox)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target browser(s) to publish'
        type: choice
        options:
          - all
          - chrome
          - firefox
        default: all
      auto_publish_chrome:
        description: 'Auto publish to Chrome Web Store after upload'
        type: boolean
        default: true
        required: false
  release:
    types: [published]

jobs:
  check-version-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun scripts/check-version-alignment.ts

  # Always called and skipped from inside: GitHub never resolves the jobs of a
  # skipped reusable-workflow call and shows them as "Waiting for pending jobs".
  validate:
    needs: check-version-alignment
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build_and_test.yaml
    with:
      skip: ${{ needs.check-version-alignment.result != 'success' }}
      build-context: browser

  publish-chrome:
    needs: [check-version-alignment, validate]
    name: 🌐 Chrome Web Store
    if: ${{ github.event_name == 'release' || github.event.inputs.target == 'all' || github.event.inputs.target == 'chrome' }}
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: ./.github/actions/restore-workspaces

      - name: 📦 Zip extension
        run: |
          (cd packages/@intlayer/chrome-extension/dist && zip -r "${GITHUB_WORKSPACE:-$PWD}/extension-chrome.zip" . -x '*/.*' '.*')
          echo "Zip created at extension-chrome.zip:"
          ls -lh extension-chrome.zip

      - name: 🚀 Upload and Publish to Chrome Web Store
        run: |
          if [ "$AUTO_PUBLISH_CHROME" = "false" ]; then
            bunx chrome-webstore-upload-cli@3 upload --source extension-chrome.zip
          else
            bunx chrome-webstore-upload-cli@3 upload --source extension-chrome.zip --auto-publish
          fi
        env:
          AUTO_PUBLISH_CHROME: ${{ github.event.inputs.auto_publish_chrome }}
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

  publish-firefox:
    needs: [check-version-alignment, validate]
    name: 🦊 Mozilla AMO (Firefox)
    if: ${{ github.event_name == 'release' || github.event.inputs.target == 'all' || github.event.inputs.target == 'firefox' }}
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/restore-workspaces

      - name: 📦 Zip extension
        run: |
          (cd packages/@intlayer/chrome-extension/dist && zip -r "${GITHUB_WORKSPACE:-$PWD}/extension-firefox.zip" . -x '*/.*' '.*')
          echo "Zip created at extension-firefox.zip:"
          ls -lh extension-firefox.zip

      - name: 🦊 Upload and Publish to Mozilla AMO
        uses: wdzeng/firefox-addon@v1
        env:
          FIREFOX_EXTENSION_ID: 'i18n-scanner@intlayer.org'
        with:
          addon-guid: ${{ env.FIREFOX_EXTENSION_ID }}
          xpi-path: extension-firefox.zip
          jwt-issuer: ${{ secrets.FIREFOX_JWT_ISSUER }}
          jwt-secret: ${{ secrets.FIREFOX_JWT_SECRET }}

  # Deletes this run's package archive once both stores are done. Kept after a
  # failure, so "Re-run failed jobs" can still restore it.
  cleanup-context:
    needs: [check-version-alignment, validate, publish-chrome, publish-firefox]
    if: ${{ !cancelled() && needs.check-version-alignment.result == 'success' && needs.validate.result == 'success' && !contains(needs.*.result, 'failure') }}
    name: 🧹 Remove build context
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 🧹 Delete this run's package archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "workspace-build") | .id')
          for id in $ids; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
