name: 🐳 Self-host Container

# Builds the all-in-one self-hosting image (app + backend + redis + minio, plus a
# bundled Chromium for screenshots) and pushes it to GHCR and Docker Hub. Manual
# only — triggered from the Actions tab.
#
# NOTE: MongoDB is NOT bundled for use — the backend connects to an external
# MongoDB Atlas cluster via DB_ID / DB_MDP / DB_CLUSTER at runtime. The browser
# facing VITE_* URLs are inlined at build time and left at their localhost defaults
# (see docker/selfhost/Dockerfile), so the published image is reached on
# http://localhost:3000. See docs/docs/en/self_hosting.md for the full flow.
on:
  push:
    branches:
      - 'main'
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (in addition to "latest")'
        required: false
        default: ''
      platforms:
        description: 'Target platforms (comma-separated)'
        required: false
        # amd64 covers Intel Macs, Windows (Docker Desktop/WSL2) and most Linux;
        # arm64 covers Apple Silicon Macs and Windows-on-ARM.
        default: 'linux/amd64,linux/arm64'

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  # GHCR repo follows the GitHub owner. The Docker Hub repo (when configured) is
  # derived from DOCKERHUB_USERNAME in the "Resolve target registries" step.
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/intlayer-selfhost

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔎 Check version change
        id: check
        run: bash .github/scripts/check-version-change.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE_SHA: ${{ github.event.before }}

  build:
    # Prevents the workflow from running on forks and only runs when version changed
    needs: check-version
    if: ${{ github.repository_owner == 'aymericzip' && needs.check-version.outputs.changed == 'true' }}

    name: 🐳 Build ${{ matrix.platform }}
    # One job per platform, each on a runner of that architecture. Building
    # arm64 through QEMU on an amd64 runner emulates the whole toolchain (bun
    # install, turbo, the Vite build and the prerender crawl) and takes hours;
    # a native arm64 runner builds it in about the same time as amd64.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🔎 Check platform is requested
        id: requested
        env:
          PLATFORMS: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ ",${PLATFORMS// /}," == *",${PLATFORM},"* ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${PLATFORM} is not in the requested platforms (${PLATFORMS}); skipping."
          fi

      - name: ⬇️ Checkout
        if: steps.requested.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        if: steps.requested.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 🔎 Resolve target registries
        id: registries
        if: steps.requested.outputs.enabled == 'true'
        run: bash .github/scripts/resolve-selfhost-images.sh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🔑 Log in to GHCR
        if: steps.requested.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔑 Log in to Docker Hub
        if: steps.requested.outputs.enabled == 'true' && steps.registries.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Compute labels
        id: meta
        if: steps.requested.outputs.enabled == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}

      # Pushed by digest only: tags are attached once every platform is built,
      # when the merge job assembles the multi-arch manifest list.
      - name: 🏗️ Build & push by digest
        id: build
        if: steps.requested.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/selfhost/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ steps.registries.outputs.images }}",push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=${{ matrix.artifact }}

      - name: 📤 Export digest
        if: steps.requested.outputs.enabled == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: 📤 Upload digest
        if: steps.requested.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: 🐳 Publish multi-arch manifest
    needs: [check-version, build]
    if: ${{ github.repository_owner == 'aymericzip' && needs.check-version.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: 📥 Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔎 Resolve target registries
        id: registries
        run: bash .github/scripts/resolve-selfhost-images.sh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔑 Log in to Docker Hub
        if: steps.registries.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
            type=raw,value=${{ needs.check-version.outputs.version }},enable=${{ github.event.inputs.tag == '' && needs.check-version.outputs.version != '' }}
            type=raw,value=v${{ needs.check-version.outputs.version }},enable=${{ github.event.inputs.tag == '' && needs.check-version.outputs.version != '' }}
            type=sha,format=short

      # Every per-platform digest was pushed to every registry, so the manifest
      # list can be assembled from the GHCR copies and tagged into each of them.
      - name: 🧩 Create manifest list & push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${GHCR_IMAGE}@sha256:%s " *)

      - name: 🔍 Inspect published image
        run: docker buildx imagetools inspect "${GHCR_IMAGE}:latest"
