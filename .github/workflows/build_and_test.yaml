name: 🔨 Build & Test

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      build-context:
        description: Package outputs required by downstream jobs
        type: string
        default: none
      # Callers pass this instead of an `if:` on the calling job: GitHub never
      # resolves the jobs of a skipped reusable-workflow call and shows them as
      # "Waiting for pending jobs" forever.
      skip:
        description: Skip the build while still reporting it as skipped
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.repository_owner == 'aymericzip' && !inputs.skip && (github.event_name != 'pull_request' || github.actor != 'github-actions') }}
    name: 🔨 Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: ./.github/actions/install-workspaces
      - name: 📝 Run linter
        run: bun run lint-staged
      - name: 🏗️ Build workspaces
        run: bun run build:ci
      - name: 🧪 Test packages
        run: bun run test
      - name: 🧪 Test npm release workflow
        run: |
          bun run tsc -p scripts/tsconfig.json
          bun test scripts/npm-release.test.ts scripts/check-version-alignment.test.ts scripts/check-extension-releases.test.ts
      - name: Archive tested package outputs
        if: inputs.build-context && inputs.build-context != 'none'
        env:
          BUILD_CONTEXT: ${{ inputs.build-context }}
        run: bash .github/scripts/archive-workspaces.sh
      - uses: actions/upload-artifact@v4
        if: inputs.build-context && inputs.build-context != 'none'
        with:
          name: workspace-build
          path: ${{ runner.temp }}/packages.tar.gz
          compression-level: 0
          retention-days: 1
          overwrite: true
