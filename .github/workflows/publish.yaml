# Publishes every public workspace package to npm through trusted publishing
# (OIDC). No npm token or 2FA code is involved: GitHub mints a short-lived
# identity token that npm exchanges for a single-use publish credential, and
# provenance attestations are generated automatically.
#
# One-time setup on npmjs.com, for each package:
#   Package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: aymericzip
#     Repository:           intlayer
#     Workflow filename:    publish.yaml   (must match this file name exactly)
#     Environment name:     npm
#     Allowed actions:      npm publish
#
# Moving `staging` to `latest` does not use OIDC: enabling "npm dist-tag" on
# every trusted publisher costs one 2FA challenge per package. The promote job
# uses a granular token instead, created once (one 2FA challenge, 90 days max):
#   npx npm@latest token create --name intlayer-promote --packages-all \
#     --packages-and-scopes-permission read-write-stage-only --bypass-2fa \
#     --expires 90
#   gh secret set NPM_TOKEN --env npm-promote   (or repo-level)
# Stage-only tokens cannot publish versions but can still change dist-tags.
#
# GitHub environments:
#   npm          No required reviewers: the OIDC identity npm trusts, so
#                staging publishes without approval.
#   npm-promote  Required reviewers. Reads NPM_TOKEN; approving it is the
#                only review, the move from `staging` to `latest`.
#
# The `intlayer-swc-plugin` crate is published to crates.io the same way
# (trusted publishing through OIDC, no `CARGO_REGISTRY_TOKEN` secret).
#
# One-time setup on crates.io:
#   Crate → Settings → Trusted Publishing → Add GitHub
#     Repository owner:     aymericzip
#     Repository name:      intlayer
#     Workflow filename:    publish.yaml
#     Environment:          crates-io

name: 📦 Build, test and release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - package.json
      - 'apps/website/**'
  workflow_dispatch:
    inputs:
      target:
        description: Release target
        type: choice
        options: [npm, china, tauri, vscode, selfhost]
        default: npm
      dry-run:
        description: Dry run for npm, crates.io or VS Code
        type: boolean
        default: false
      pre-release:
        description: Publish a VS Code pre-release
        type: boolean
        default: false
      tag:
        description: Additional self-host image tag
        type: string
      platforms:
        description: Self-host image platforms
        type: string
        default: linux/amd64,linux/arm64

concurrency: release-${{ github.ref }}-${{ inputs.target || 'npm' }}

permissions:
  contents: read

jobs:
  targets:
    if: github.repository_owner == 'aymericzip'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      version-release: ${{ steps.check.outputs.changed == 'true' && github.event_name == 'push' && github.ref_type == 'branch' }}
      china: ${{ steps.website.outputs.changed == 'true' || inputs.target == 'china' }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔎 Check version change
        id: check
        run: bash .github/scripts/check-version-change.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE_SHA: ${{ github.event.before }}

      - name: 🥡 Setup bun for release validation
        if: steps.check.outputs.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: 🔎 Check release version alignment
        if: steps.check.outputs.changed == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: bun scripts/check-version-alignment.ts

      - name: Check website changes in the push
        id: website
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then BEFORE_SHA=$(git hash-object -t tree /dev/null); fi
          changed_files=$(git diff --name-only "$BEFORE_SHA" HEAD -- apps/website)
          if [[ -n "$changed_files" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: targets
    if: needs.targets.outputs.version-release == 'true' || needs.targets.outputs.china == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build_and_test.yaml
    with:
      build-context: ${{ needs.targets.outputs.version-release == 'true' && 'release' || inputs.target == 'selfhost' && 'none' || inputs.target || github.ref_type == 'tag' && 'tauri' || 'china' }}

  check-npm:
    needs: targets
    if: needs.targets.outputs.version-release == 'true' || inputs.target == 'npm'
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.registry.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        if: ${{ !inputs.dry-run }}
        with:
          bun-version: 1.4.5

      - name: Check whether npm already serves this release
        id: registry
        if: ${{ !inputs.dry-run }}
        run: |
          # Resolve the same Turbo release set without installing the monorepo.
          npm install --prefix "$RUNNER_TEMP/release-tools" --no-audit --no-fund "turbo@$(jq -er '.devDependencies.turbo' package.json)"
          RELEASE_TURBO_PATH="$RUNNER_TEMP/release-tools/node_modules/.bin/turbo" bun scripts/check-npm-release.ts

  build-packages:
    needs: [validate, check-npm]
    if: inputs.dry-run || needs.check-npm.outputs.needed == 'true'
    name: 📦 Pack tested npm packages
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max_old_space_size=8192'
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🥡 Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: 🟢 Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 🦀 Setup rust (swc plugin)
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-wasip1

      - name: 🔆 Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/@intlayer/swc

      - uses: ./.github/actions/restore-workspaces

      - name: Prepare release files and pack with Bun
        run: |
          npm install --prefix "$RUNNER_TEMP/release-tools" --no-audit --no-fund "turbo@$(jq -er '.devDependencies.turbo' package.json)"
          export RELEASE_TURBO_PATH="$RUNNER_TEMP/release-tools/node_modules/.bin/turbo"
          bun scripts/prepare-npm-release.ts --check
          "$RELEASE_TURBO_PATH" run prepublish '--filter=./packages/**' '--filter=./docs' '--filter=./plugins/**' '--filter=./compat/**' --force
          bun scripts/prepare-npm-release.ts

      - name: ⬆️ Save release archives
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-${{ github.run_id }}
          path: .npm-release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: true
          overwrite: true

  publish:
    permissions:
      contents: read
      id-token: write
    needs: build-packages
    if: ${{ !cancelled() && needs.build-packages.result == 'success' }}
    name: 📦 Publish to staging
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🥡 Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: 🟢 Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: ⬆️ Update npm
        run: npm install -g npm@latest && npm --version

      - name: ⬇️ Restore release archives
        uses: actions/download-artifact@v4
        with:
          name: npm-release-${{ github.run_id }}
          path: .npm-release/

      # Twenty attempts, 30s apart. Only missing packages are retried; no build,
      # install or pack happens here, including when re-running failed jobs.
      - name: 🚀 Publish and verify metadata and tarballs
        run: bun run publish:ci:stage
        env:
          PUBLISH_DRY_RUN: ${{ inputs.dry-run || false }}

  # The only review of an npm release, once staging is complete. No `id-token`:
  # npm would otherwise exchange OIDC for a credential without dist-tag access
  # and ignore NPM_TOKEN.
  promote:
    permissions:
      contents: read
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    name: 🏷️ Promote complete npm release
    runs-on: ubuntu-latest
    environment: npm-promote
    steps:
      - name: 🔐 Check promote token
        if: ${{ !inputs.dry-run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo '::error::NPM_TOKEN secret is missing (repository or npm-promote environment, see the header of publish.yaml)'
            exit 1
          fi

      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🥡 Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: 🟢 Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: ⬇️ Restore release archives
        uses: actions/download-artifact@v4
        with:
          name: npm-release-${{ github.run_id }}
          path: .npm-release/

      # Rechecks the entire release before changing any tag. Stable versions
      # go to latest; prereleases keep their canary/beta/rc/etc. channel.
      - name: 🏷️ Promote dist-tags
        run: bun run publish:ci:promote
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_DRY_RUN: ${{ inputs.dry-run || false }}

  publish-crate:
    permissions:
      contents: read
      id-token: write
    needs: [targets, validate]
    if: needs.targets.outputs.version-release == 'true' || inputs.target == 'npm'

    name: 🦀 Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    defaults:
      run:
        working-directory: packages/@intlayer/swc
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🥡 Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: 🦀 Setup rust
        uses: dtolnay/rust-toolchain@1.89.0

      - name: 🔆 Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/@intlayer/swc

      # The version bump only touches package.json files: align the crate
      # manifest with the npm version being released.
      - name: 🔁 Sync crate version
        run: bun ../../../scripts/sync-crate-version.ts

      # Republishing an existing version is an error for cargo, so skip it to
      # let a partially failed release be re-run, like the npm job does.
      - name: 🔎 Check crates.io
        id: registry
        run: |
          VERSION=$(bun -e 'console.log(require("./package.json").version)')
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: intlayer publish workflow (https://github.com/aymericzip/intlayer)' \
            "https://crates.io/api/v1/crates/intlayer-swc-plugin/$VERSION")
          if [ "$STATUS" = "200" ]; then
            echo "⚠️  intlayer-swc-plugin@$VERSION is already published, skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "📦 intlayer-swc-plugin@$VERSION"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔐 Authenticate to crates.io
        if: ${{ steps.registry.outputs.published == 'false' && !inputs.dry-run }}
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # `--allow-dirty`: the synced manifest is not committed on the runner.
      - name: 🚀 Publish crate
        if: ${{ steps.registry.outputs.published == 'false' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --allow-dirty ${{ inputs.dry-run && '--dry-run' || '' }}

  china:
    needs: [targets, validate]
    if: needs.targets.outputs.china == 'true'
    uses: ./.github/workflows/deploy-website-china.yaml
    secrets: inherit

  tauri:
    needs: [targets, validate]
    if: needs.targets.outputs.version-release == 'true' || (github.event_name == 'push' && github.ref_type == 'tag') || inputs.target == 'tauri'
    permissions:
      contents: write
    uses: ./.github/workflows/tauri-app-release.yaml
    secrets: inherit

  vscode:
    needs: [targets, validate]
    if: needs.targets.outputs.version-release == 'true' || inputs.target == 'vscode'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-vscode-extension.yaml
    with:
      dry-run: ${{ inputs.dry-run || false }}
      pre-release: ${{ inputs.pre-release || false }}
    secrets: inherit

  selfhost:
    needs: [targets, validate]
    if: needs.targets.outputs.version-release == 'true' || inputs.target == 'selfhost'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/selfhost-container-release.yaml
    with:
      version: ${{ needs.targets.outputs.version }}
      tag: ${{ inputs.tag || '' }}
      platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
    secrets: inherit

  cleanup-context:
    needs:
      [
        validate,
        check-npm,
        build-packages,
        publish,
        promote,
        china,
        tauri,
        vscode,
      ]
    if: ${{ !cancelled() && needs.validate.result == 'success' && !contains(needs.*.result, 'failure') }}
    permissions:
      actions: write
    uses: ./.github/workflows/cleanup-build-context.yaml
