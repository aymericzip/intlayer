# Publishes every public workspace package to npm through trusted publishing
# (OIDC). No npm token or 2FA code is involved: GitHub mints a short-lived
# identity token that npm exchanges for a single-use publish credential, and
# provenance attestations are generated automatically.
#
# One-time setup on npmjs.com, for each package:
#   Package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user: aymericzip
#     Repository:           intlayer
#     Workflow filename:    publish.yaml   (must match this file name exactly)
#     Environment name:     npm
#
# The release gate is the `release` GitHub environment (required reviewers):
# the `approve` job waits on it right after the version check, before any
# build starts. A manual run started by aymericzip skips it. The `npm` and
# `crates-io` environments only scope the OIDC trust, so they must not require
# reviewers, or the run would pause a second time.
#
# The `intlayer-swc-plugin` crate is published to crates.io the same way
# (trusted publishing through OIDC, no `CARGO_REGISTRY_TOKEN` secret).
#
# One-time setup on crates.io:
#   Crate → Settings → Trusted Publishing → Add GitHub
#     Repository owner:     aymericzip
#     Repository name:      intlayer
#     Workflow filename:    publish.yaml
#     Environment:          crates-io

name: 📦 Publish to npm

on:
  push:
    branches:
      - 'main'
    paths:
      - 'package.json'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and pack everything without publishing'
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔎 Check version change
        id: check
        run: bash .github/scripts/check-version-change.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE_SHA: ${{ github.event.before }}

  approve:
    # Release gate, asked once at the start of the run. A manual run started
    # by the maintainer is already an explicit decision, so it is skipped.
    needs: check-version
    if: ${{ github.repository_owner == 'aymericzip' && needs.check-version.outputs.changed == 'true' && !(github.event_name == 'workflow_dispatch' && github.triggering_actor == 'aymericzip') }}

    name: ✅ Approve release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: ✅ Approved
        run: echo "Release ${{ needs.check-version.outputs.version }} approved"

  publish:
    # Prevents the workflow from running on forks, only runs when version
    # changed, and waits for the release gate (or its skip)
    needs: [check-version, approve]
    if: ${{ !cancelled() && github.repository_owner == 'aymericzip' && needs.check-version.outputs.changed == 'true' && contains(fromJSON('["success", "skipped"]'), needs.approve.result) }}

    name: 📦 Publish
    runs-on: ubuntu-latest
    environment: npm
    env:
      NODE_OPTIONS: '--max_old_space_size=8192'
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🥡 Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          version: 1.4.2
          run_install: false

      - name: 🟢 Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1
      - name: ⬆️ Update npm
        run: npm install -g npm@latest && npm --version

      - name: 🦀 Setup rust (swc plugin)
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: wasm32-wasip1

      - name: 🔆 Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/@intlayer/swc

      - name: 🔆 Cache bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: 🧩 Install Dependencies
        run: bun install --frozen-lockfile

      # Everything is built (and prepublished) up front: a failure stops the
      # release before anything reaches the registry.
      - name: 🏗️ Build packages
        run: bun run publish:ci:build

      # The dist-tag comes from the version: 9.0.0 → latest, 9.0.0-canary.0 → canary
      - name: 🚀 Publish packages
        env:
          PUBLISH_DRY_RUN: ${{ inputs.dry-run || false }}
        # Packages are already built, so every package is published in
        # parallel (`publish:ci` has no task dependency). `--continue`
        # keeps publishing the other packages when one fails. After each pass
        # the registry is checked for every package: missing ones trigger a
        # new pass (already published packages are skipped), up to 3 passes,
        # then the job fails so the run can be re-run.
        run: |
          MAX_PASSES=3
          for PASS in $(seq 1 $MAX_PASSES); do
            echo "🚀 Publishing packages (pass $PASS/$MAX_PASSES)..."
            if bun run publish:ci; then
              PUBLISH_OK=true
            else
              PUBLISH_OK=false
              echo "⚠️ Some packages failed to publish in pass $PASS"
            fi

            # A dry run publishes nothing, so the registry cannot be checked.
            if [ "$PUBLISH_DRY_RUN" = "true" ]; then
              [ "$PUBLISH_OK" = "true" ] && exit 0
            else
              echo "🔎 Checking the registry..."
              if bun scripts/verify-published-packages.mjs; then
                exit 0
              fi
            fi
          done
          echo "❌ Some packages are still not published after $MAX_PASSES passes."
          exit 1

  publish-crate:
    needs: [check-version, approve]
    if: ${{ !cancelled() && github.repository_owner == 'aymericzip' && needs.check-version.outputs.changed == 'true' && contains(fromJSON('["success", "skipped"]'), needs.approve.result) }}

    name: 🦀 Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    defaults:
      run:
        working-directory: packages/@intlayer/swc
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🥡 Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          version: 1.4.2
          run_install: false

      - name: 🦀 Setup rust
        uses: dtolnay/rust-toolchain@1.89.0

      - name: 🔆 Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/@intlayer/swc

      # The version bump only touches package.json files: align the crate
      # manifest with the npm version being released.
      - name: 🔁 Sync crate version
        run: bun ../../../scripts/sync-crate-version.mjs

      # Republishing an existing version is an error for cargo, so skip it to
      # let a partially failed release be re-run, like the npm job does.
      - name: 🔎 Check crates.io
        id: registry
        run: |
          VERSION=$(bun -e 'console.log(require("./package.json").version)')
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: intlayer publish workflow (https://github.com/aymericzip/intlayer)' \
            "https://crates.io/api/v1/crates/intlayer-swc-plugin/$VERSION")
          if [ "$STATUS" = "200" ]; then
            echo "⚠️  intlayer-swc-plugin@$VERSION is already published, skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "📦 intlayer-swc-plugin@$VERSION"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔐 Authenticate to crates.io
        if: ${{ steps.registry.outputs.published == 'false' && !inputs.dry-run }}
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # `--allow-dirty`: the synced manifest is not committed on the runner.
      - name: 🚀 Publish crate
        if: ${{ steps.registry.outputs.published == 'false' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --allow-dirty ${{ inputs.dry-run && '--dry-run' || '' }}
